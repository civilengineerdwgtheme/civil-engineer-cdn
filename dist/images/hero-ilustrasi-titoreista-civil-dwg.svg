<svg xmlns="http://www.w3.org/2000/svg" class="hb" viewBox="0 0 640 460" width="640" height="460" role="img" aria-labelledby="hi-title hi-desc" preserveAspectRatio="xMidYMid meet" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="hi-title">Ilustrasi gambar teknik sipil DWG</title>
  <desc id="hi-desc">Gambar elevasi jembatan cable-stayed bergaya CAD lengkap dengan garis dimensi, ikon UCS, panah utara, dan ikon konversi PDF ke DWG. Latar transparan, warna menyesuaikan mode terang dan gelap.</desc>

  <style>
    .hb{--ink:#0B2A5B;--sub:#3D5280;--or:#F26B21;--red:#D62839;--navy:#0B2A5B;--grid:#0B2A5B}
    @media (prefers-color-scheme:dark){
      .hb{--ink:#E8EEFB;--sub:#A9B9DB;--or:#FF8A3D;--red:#FF5C6C;--navy:#27499B;--grid:#8FA8E0}
    }
    /* Opsional bila SVG di-inline dan situs memakai class / atribut tema sendiri */
    .dark .hb,[data-theme="dark"] .hb{--ink:#E8EEFB;--sub:#A9B9DB;--or:#FF8A3D;--red:#FF5C6C;--navy:#27499B;--grid:#8FA8E0}
    .nf{fill:none}
    .si{stroke:var(--ink)} .so{stroke:var(--or)} .sr{stroke:var(--red)} .sg{stroke:var(--grid)}
    .fi{fill:var(--ink)} .fo{fill:var(--or)} .fr{fill:var(--red)} .fn{fill:var(--navy)} .fw{fill:#fff}
    .mono{font-family:Consolas,"SFMono-Regular",Menlo,"Courier New",monospace}
  </style>

  <defs>
    <pattern id="gMinor" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M20 0H0V20" class="nf sg" stroke-width=".5" opacity=".14"/>
    </pattern>
    <pattern id="gMajor" width="100" height="100" patternUnits="userSpaceOnUse">
      <path d="M100 0H0V100" class="nf sg" stroke-width="1" opacity=".22"/>
    </pattern>
    <radialGradient id="fade" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#fff" stop-opacity="1"/>
      <stop offset=".65" stop-color="#fff" stop-opacity=".55"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <mask id="gm"><rect width="640" height="460" fill="url(#fade)"/></mask>
    <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="8" class="si" stroke-width="1" opacity=".55"/>
    </pattern>
    <pattern id="posts" width="20" height="12" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="12" class="si" stroke-width="1" opacity=".55"/>
    </pattern>
  </defs>

  <!-- Kisi CAD: memudar ke tepi agar menyatu dengan kartu hero -->
  <g mask="url(#gm)">
    <rect width="640" height="460" fill="url(#gMinor)"/>
    <rect width="640" height="460" fill="url(#gMajor)"/>
  </g>

  <!-- Tanda sudut -->
  <path d="M8 32V8H32M608 8H632V32M8 428V452H32M608 452H632V428" class="nf so" stroke-width="3" stroke-linecap="square"/>

  <!-- Jembatan cable-stayed (elevasi) -->
  <g transform="translate(-549.4,-36.1) scale(0.78)">
    <!-- Tanah -->
    <rect x="730" y="430" width="770" height="16" fill="url(#hatch)"/>
    <line x1="730" y1="430" x2="1500" y2="430" class="so" stroke-width="4"/>
    <rect x="1066" y="430" width="68" height="14" class="fn" opacity=".55"/>
    <rect x="1066" y="430" width="68" height="14" class="nf si" stroke-width="1.5"/>

    <!-- Abutmen -->
    <rect x="786" y="354" width="28" height="76" class="fn" opacity=".3"/>
    <rect x="786" y="354" width="28" height="76" class="nf si" stroke-width="2"/>
    <rect x="1386" y="354" width="28" height="76" class="fn" opacity=".3"/>
    <rect x="1386" y="354" width="28" height="76" class="nf si" stroke-width="2"/>

    <!-- Pylon -->
    <polygon points="1086,430 1100,166 1114,430" class="fn si" stroke-width="1.5"/>

    <!-- Dek + railing -->
    <rect x="780" y="338" width="640" height="16" class="fn si" stroke-width="1.5"/>
    <rect x="780" y="326" width="640" height="12" fill="url(#posts)"/>
    <line x1="780" y1="326" x2="1420" y2="326" class="si" stroke-width="1.2" opacity=".6"/>
    <line x1="780" y1="338" x2="1420" y2="338" class="so" stroke-width="4"/>

    <!-- Kabel -->
    <path class="nf so" stroke-width="2" stroke-linecap="round" d="
      M1100 262L1140 338M1100 246L1190 338M1100 230L1240 338M1100 214L1290 338M1100 198L1340 338M1100 182L1390 338
      M1100 262L1060 338M1100 246L1010 338M1100 230L960 338M1100 214L910 338M1100 198L860 338M1100 182L810 338"/>
    <circle cx="1100" cy="166" r="6" class="fr"/>

    <!-- Garis sumbu -->
    <line x1="1100" y1="130" x2="1100" y2="462" class="sr" stroke-width="1.8" stroke-dasharray="18 5 3 5"/>

    <!-- Penanda elevasi tanah -->
    <polygon points="748,414 768,414 758,429" class="fr"/>

    <!-- Label pylon + garis ekstensi tinggi -->
    <line x1="1124" y1="166" x2="1500" y2="166" class="si" stroke-width="1.2" stroke-dasharray="6 4" opacity=".5"/>
    <text x="1124" y="156" class="mono fo" font-size="21" font-weight="700">Pylon P1  EL +26.400</text>

    <!-- Dimensi horizontal -->
    <line x1="780" y1="432" x2="780" y2="500" class="si" stroke-width="1.2" opacity=".5"/>
    <line x1="1420" y1="432" x2="1420" y2="500" class="si" stroke-width="1.2" opacity=".5"/>
    <line x1="780" y1="490" x2="1420" y2="490" class="si" stroke-width="1.5"/>
    <line x1="772" y1="498" x2="788" y2="482" class="sr" stroke-width="3"/>
    <line x1="1412" y1="498" x2="1428" y2="482" class="sr" stroke-width="3"/>
    <text x="1100" y="478" text-anchor="middle" class="mono fi" font-size="23" font-weight="700">L = 64.000</text>

    <!-- Dimensi vertikal -->
    <line x1="1490" y1="166" x2="1490" y2="430" class="si" stroke-width="1.5"/>
    <line x1="1482" y1="174" x2="1498" y2="158" class="sr" stroke-width="3"/>
    <line x1="1482" y1="438" x2="1498" y2="422" class="sr" stroke-width="3"/>
    <text transform="translate(1472,298) rotate(-90)" text-anchor="middle" class="mono fi" font-size="23" font-weight="700">H = 26.400</text>
  </g>

  <!-- Panah utara -->
  <circle cx="596" cy="44" r="20" class="nf si" stroke-width="1.3" opacity=".8"/>
  <polygon points="596,28 603,50 596,45 589,50" class="fr"/>
  <text x="596" y="20" text-anchor="middle" class="mono fi" font-size="13" font-weight="700">N</text>

  <!-- Ikon konversi PDF ke DWG -->
  <g>
    <path d="M34 388H64L78 402V444H34Z" class="nf sr" stroke-width="2.5" stroke-linejoin="round"/>
    <path d="M64 388V402H78" class="nf sr" stroke-width="2.5" stroke-linejoin="round"/>
    <text x="56" y="432" text-anchor="middle" class="mono fr" font-size="14" font-weight="700">PDF</text>

    <line x1="94" y1="416" x2="136" y2="416" class="so" stroke-width="3.5" stroke-linecap="round"/>
    <polygon points="148,416 136,408 136,424" class="fo"/>

    <path d="M162 388H192L206 402V444H162Z" class="fn si" stroke-width="2" stroke-linejoin="round"/>
    <path d="M192 388V402H206" class="nf so" stroke-width="2.5" stroke-linejoin="round"/>
    <text x="184" y="432" text-anchor="middle" class="mono fw" font-size="14" font-weight="700">DWG</text>
  </g>

  <!-- Ikon UCS -->
  <line x1="560" y1="436" x2="596" y2="436" class="sr" stroke-width="2.5"/>
  <polygon points="604,436 594,431 594,441" class="fr"/>
  <line x1="560" y1="436" x2="560" y2="400" class="so" stroke-width="2.5"/>
  <polygon points="560,392 555,402 565,402" class="fo"/>
  <rect x="556" y="432" width="8" height="8" class="nf si" stroke-width="1.2"/>
  <text x="610" y="441" class="mono fr" font-size="13" font-weight="700">X</text>
  <text x="560" y="384" text-anchor="middle" class="mono fo" font-size="13" font-weight="700">Y</text>
</svg>
